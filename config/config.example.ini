# platform-profile-osd configuration
# Copy to ~/.config/platform-profile-osd/config.ini to customize.

[general]
notifications_enabled = true
notify_on_startup = false
sound_enabled = false
replace_notifications = false
notification_timeout_ms = 1800

# Relative paths here are resolved from the directory containing this file.
# The built-in default is ~/.local/share/platform-profile-osd/sounds.
# sound_directory = ~/.local/share/platform-profile-osd/sounds

[sounds]
low-power = quiet.wav
cool = quiet.wav
quiet = quiet.wav
balanced = balanced.wav
balanced-performance = performance.wav
performance = performance.wav

# Empty means that custom and unknown profiles are silent by default.
default =
